<div class="container hero">
  <div class="copy">
    <p class="kicker">
      <span class="rule" aria-hidden="true"></span>Digital invitation studio · Tbilisi
    </p>
    <h1 class="headline">Elegant digital invitations, <em>designed for you.</em></h1>
    <p class="intro">
      Choose a style, share your details, and we create a personalized invitation with RSVP.
    </p>
    <div class="actions">
      <a href="#order" class="btn btn--ink cta">Order your invitation</a>
      <a href="#styles" class="btn btn--outline">See examples</a>
    </div>
    <ul class="highlights">
      @for (highlight of highlights; track highlight) {
        <li>{{ highlight }}</li>
      }
    </ul>
  </div>

  <app-envelope-demo [animate]="motion" />
</div>
