@let text = t().showcase;
<div class="container section">
  <div class="intro">
    <h2 class="display title">{{ text.title }}</h2>
    <p class="lede">{{ text.lede }}</p>
  </div>

  <div class="filters" role="group" [attr.aria-label]="text.filterLabel">
    @for (filter of occasionFilters; track filter) {
      <button
        type="button"
        class="filter"
        [class.is-selected]="store.occasion() === filter"
        [attr.aria-pressed]="store.occasion() === filter"
        [attr.aria-label]="t().occasions[filter] + ', ' + text.styleCount(store.styleCount(filter))"
        (click)="store.selectOccasion(filter)"
      >
        {{ t().occasions[filter] }}<span class="filter__count" aria-hidden="true">{{
          store.styleCount(filter)
        }}</span>
      </button>
    }
  </div>

  <div class="themes" aria-live="polite">
    @for (theme of store.visibleThemes(); track theme.id) {
      <app-theme-card
        [theme]="theme"
        [occasion]="store.occasionFor(theme)"
        (view)="store.openLive(theme.id)"
      />
    }
  </div>
</div>
