@let text = t().hero;
<div class="container hero">
  <div class="copy">
    <h1 class="headline">{{ text.headline }}</h1>
    <p class="intro">{{ text.intro }}</p>
    <div class="actions">
      <a href="#order" class="btn btn--ink">{{ text.orderCta }}</a>
      <a href="#styles" class="text-link">{{ text.examplesCta }}</a>
    </div>
    <ul class="facts">
      @for (fact of text.highlights; track fact) {
        <li>{{ fact }}</li>
      }
    </ul>
  </div>

  <app-product-video-demo [animate]="motion" />
</div>
