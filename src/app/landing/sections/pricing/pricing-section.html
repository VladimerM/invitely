@let text = t().pricing;
<div class="container section">
  <h2 class="display heading">{{ text.title }}</h2>

  <div class="packages">
    @for (pkg of packages(); track pkg.id) {
      <article class="package" [class.package--featured]="pkg.featured">
        <p class="package__note">
          @if (pkg.featured) {
            {{ text.mostChosen }}
          }
        </p>
        <header class="package__header">
          <h3 class="package__name">{{ pkg.name }}</h3>
          <p class="package__tagline">{{ pkg.tagline }}</p>
        </header>
        <p class="price">
          <span class="price__amount">{{ pkg.price }}</span>
          <span class="price__currency" [attr.aria-label]="text.currencyLabel">₾</span>
        </p>
        <ul class="features">
          @for (feature of pkg.features; track feature) {
            <li>{{ feature }}</li>
          }
        </ul>
        <a
          href="#order"
          class="btn btn--block choose"
          [class.btn--ink]="pkg.featured"
          [class.btn--outline]="!pkg.featured"
        >
          {{ text.choose(pkg.name) }}
        </a>
      </article>
    }
  </div>
</div>
