@let text = t().hero;
<div class="container hero">
  <div class="copy">
    <p class="kicker"><span class="rule" aria-hidden="true"></span>{{ text.kicker }}</p>
    <h1 class="headline">{{ text.headline.lead }} <em>{{ text.headline.em }}</em></h1>
    <p class="intro">{{ text.intro }}</p>
    <div class="actions">
      <a href="#order" class="btn btn--ink cta">{{ text.orderCta }}</a>
      <a href="#styles" class="btn btn--outline">{{ text.examplesCta }}</a>
    </div>
    <ul class="highlights">
      @for (highlight of text.highlights; track highlight) {
        <li>{{ highlight }}</li>
      }
    </ul>
  </div>

  <app-product-video-demo [animate]="motion" />
</div>
