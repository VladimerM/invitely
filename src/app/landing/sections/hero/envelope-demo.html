@let step = phase();
<div class="halo" aria-hidden="true"></div>

<app-phone-frame
  role="img"
  aria-label="An envelope opens on a phone to reveal Nino and Giorgi's wedding invitation"
>
  <div
    class="stage"
    [class.is-flap-open]="step >= 1"
    [class.is-card-raised]="step >= 2"
    [class.is-revealed]="step === 3"
    aria-hidden="true"
  >
    <div class="envelope-scene">
      <div class="envelope">
        <div class="letter">
          <span class="letter__kicker">You are invited</span>
          <span class="letter__names">Nino &amp; Giorgi</span>
          <span class="diamond"></span>
          <span class="letter__date">12 · 06 · 2027</span>
        </div>
        <div class="pocket"></div>
        <div class="flap"></div>
        <div class="seal">N·G</div>
      </div>
    </div>

    <div class="invitation">
      <div class="photo-placeholder invitation__photo">couple photo</div>
      <div class="invitation__body">
        <span class="invitation__kicker">Together with their families</span>
        <span class="invitation__names">Nino <span class="amp">&amp;</span> Giorgi</span>
        <span class="invitation__when">Saturday, 12 June 2027 · Tbilisi</span>
        <app-countdown-tiles size="compact" [target]="weddingStartsAt" />
        <span class="invitation__rsvp">RSVP</span>
      </div>
    </div>
  </div>
</app-phone-frame>
