@let text = t().showcase;
<div class="container section">
  <div class="section-intro">
    <div class="section-intro__heading">
      <app-eyebrow tone="gold">{{ text.eyebrow }}</app-eyebrow>
      <h2 class="display showcase-title">{{ text.title.lead }} <em>{{ text.title.em }}</em></h2>
    </div>
    <p class="lede">{{ text.lede }}</p>
  </div>

  <div class="occasions" role="group" [attr.aria-label]="text.filterLabel">
    @for (filter of occasionFilters; track filter) {
      <button
        type="button"
        class="occasion"
        [class.is-selected]="store.occasion() === filter"
        [attr.aria-pressed]="store.occasion() === filter"
        (click)="store.selectOccasion(filter)"
      >
        <span class="occasion__label">{{ t().occasions[filter] }}</span>
        <span class="occasion__count">{{ text.styleCount(store.styleCount(filter)) }}</span>
      </button>
    }
  </div>

  <div class="themes" aria-live="polite">
    @for (theme of store.visibleThemes(); track theme.id) {
      <app-theme-card
        [theme]="theme"
        [occasion]="store.occasionFor(theme)"
        (view)="store.openLive(theme.id)"
      />
    }
  </div>
</div>
