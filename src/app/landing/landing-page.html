<app-site-header />

<main>
  <app-hero-section id="top" />
  <app-showcase-section id="styles" />
  <app-how-it-works-section id="how" />
  <app-included-section />
  <app-rsvp-demo-section />
  <app-pricing-section id="pricing" />
  <app-testimonials-section />
  <app-faq-section id="faq" />
  <app-order-section id="order" />
</main>

<app-site-footer />

@if (showcase.liveTheme(); as theme) {
  <app-live-example-dialog
    [theme]="theme"
    [occasion]="showcase.occasionFor(theme)"
    (closed)="showcase.closeLive()"
    (previous)="showcase.stepLive(-1)"
    (next)="showcase.stepLive(1)"
    (orderStyle)="orderStyle(theme)"
  />
}
