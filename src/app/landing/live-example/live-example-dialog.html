<div class="backdrop" (click)="onBackdropClick($event)">
  <div
    #dialog
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="live-example-title"
    tabindex="-1"
  >
    <div class="details">
      <span class="details__kicker">{{ occasion() }} · Live example</span>
      <h2 class="details__name" id="live-example-title">{{ theme().name }}</h2>
      <p class="details__description">{{ theme().description }}</p>
      <div class="swatches" role="img" aria-label="Colour palette">
        <span class="swatch" [style.background]="theme().palette.background"></span>
        <span class="swatch" [style.background]="theme().palette.ink"></span>
        <span class="swatch" [style.background]="theme().palette.accent"></span>
      </div>
      <span class="details__hint">Tap the invitation to open it, then scroll.</span>
      <div class="details__actions">
        <button type="button" class="btn btn--gold order" (click)="orderStyle.emit()">
          Order this style
        </button>
        <button type="button" class="nav" aria-label="Previous style" (click)="previous.emit()">
          ←
        </button>
        <button type="button" class="nav" aria-label="Next style" (click)="next.emit()">→</button>
      </div>
    </div>

    <app-phone-frame size="large" [style.--screen-bg]="theme().palette.background">
      <app-live-invitation [theme]="theme()" />
    </app-phone-frame>
  </div>

  <button type="button" class="close" (click)="closed.emit()">Close ✕</button>
</div>
