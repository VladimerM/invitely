@let text = t().faq;
<div class="container section layout">
  <div class="section-intro__heading">
    <app-eyebrow>{{ text.eyebrow }}</app-eyebrow>
    <h2 class="display title">{{ text.title }}</h2>
  </div>

  <div class="entries">
    @for (entry of text.entries; track $index; let i = $index) {
      @let expanded = openIndex() === i;
      <div class="entry">
        <h3 class="entry__heading">
          <button
            type="button"
            class="entry__toggle"
            [id]="'faq-q-' + i"
            [attr.aria-expanded]="expanded"
            [attr.aria-controls]="'faq-a-' + i"
            (click)="toggle(i)"
          >
            <span class="entry__question">{{ entry.question }}</span>
            <span class="entry__sign" aria-hidden="true">{{ expanded ? '−' : '+' }}</span>
          </button>
        </h3>
        @if (expanded) {
          <p
            class="entry__answer"
            role="region"
            [id]="'faq-a-' + i"
            [attr.aria-labelledby]="'faq-q-' + i"
          >
            {{ entry.answer }}
          </p>
        }
      </div>
    }
  </div>
</div>
